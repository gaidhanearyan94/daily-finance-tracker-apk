name: Build & Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | cut -d'.' -f1)
          if [ -z "$JAVA_VER" ]; then
            echo "Error: Unable to detect Java version."
            exit 1
          fi
          echo "Detected Java major version: $JAVA_VER"
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "Error: Java version is lower than 17 (detected $JAVA_VER)."
            exit 1
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkey -v -keystore ./debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to create ./debug.keystore"
            exit 1
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "Error: Expected APK not found at $TARGET_APK"
            echo "Searching app/build/outputs/apk for any APKs..."
            find app/build/outputs/apk -maxdepth 3 -name "*.apk" || true
            exit 1
          fi
          if [ ! -s "$TARGET_APK" ]; then
            echo "Error: APK file $TARGET_APK is empty."
            exit 1
          fi
          case "$TARGET_APK" in
            *.apk) ;;
            *) echo "Error: File does not have .apk extension."; exit 1 ;;
          esac
          echo "APK successfully verified at $TARGET_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_ASSET_DIR=$(mktemp -d -t apk-release-XXXXXX)
          REPO_RAW="${GITHUB_REPOSITORY#*/}"
          REPO_CLEAN=$(echo "$REPO_RAW" | tr -cs 'a-zA-Z0-9._-' '-' | sed 's/^-//;s/-$//')
          if [ -z "$REPO_CLEAN" ]; then
            REPO_CLEAN="app"
          fi
          ASSET_NAME="${REPO_CLEAN}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$TEMP_ASSET_DIR/$ASSET_NAME"
          echo "asset_path=$TEMP_ASSET_DIR/$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          RELEASE_ASSET="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$RELEASE_ASSET" ]; then
            echo "Error: Prepared release asset not found: $RELEASE_ASSET"
            exit 1
          fi
          if [ ! -s "$RELEASE_ASSET" ]; then
            echo "Error: Prepared release asset is empty: $RELEASE_ASSET"
            exit 1
          fi
          case "$RELEASE_ASSET" in
            *.apk) ;;
            *) echo "Error: Asset does not end with .apk"; exit 1 ;;
          esac

          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          NOTES="$(cat <<'EOF'
This is an automatically generated debug APK.
The APK was built by GitHub Actions.

- Run Number: ${{ github.run_number }}
- Run Attempt: ${{ github.run_attempt }}
- Source Commit: ${{ github.sha }}

Note: This APK is intended for testing and is not a Play Store production release. It is signed only with a temporary debug keystore.
EOF
)"

          gh release create "$TAG" "$RELEASE_ASSET" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.create_release.outcome }}" = "success" ]; then
            echo "Release successfully published."
            TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            gh release view "$TAG"
            echo "Release tag: $TAG"
            echo "Release title: Debug APK Build #${{ github.run_number }}"
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/$TAG"
            echo "Release page URL: $RELEASE_URL"
            echo "APK Asset filename: ${{ steps.prepare_asset.outputs.asset_name }}"
            echo "### GitHub Release Published Successfully" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Download the APK directly from the release page: [$RELEASE_URL]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The APK (\`${{ steps.prepare_asset.outputs.asset_name }}\`) can be downloaded directly under the release **Assets** section." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The standard Actions artifact \`app-debug-apk\` remains available as a backup." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed or was skipped."
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "The APK build succeeded."
              echo "The Actions artifact named app-debug-apk remains available."
            fi
            echo "### GitHub Release Publishing Warning" >> "$GITHUB_STEP_SUMMARY"
            echo "Release publishing failed or was skipped. However, the APK build succeeded and the Actions backup artifact \`app-debug-apk\` remains available." >> "$GITHUB_STEP_SUMMARY"
          fi
